services:
  # 1. Backend Web Service
  - type: web
    name: mindtrack-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install && npm run db:migrate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # You will be prompted to paste your Supabase DB URL
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret key!
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: mindtrack-frontend
          property: host

  # 2. Frontend Static Site
  - type: web
    name: mindtrack-frontend
    plan: free
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mindtrack-backend
          property: host
    routes:
      # CRITICAL: Rewrite rule to support client-side routing (React Router)
      - type: rewrite
        source: /*
        destination: /index.html
